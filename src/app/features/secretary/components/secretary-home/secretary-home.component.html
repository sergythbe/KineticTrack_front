<!-- secretary-home.component.html -->
<div class="space-y-6">
  <div>
    <h1 class="text-xl font-semibold text-gray-900">
      Bonjour, {{ authService.user()?.firstname }} 
    </h1>
    <p class="text-sm text-gray-500 mt-0.5">Que souhaitez-vous faire aujourd'hui ?</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <a routerLink="/dashboard/register-patient"
       class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 flex items-center gap-4 hover:border-[#0F6E56] transition cursor-pointer">
      <div class="w-11 h-11 rounded-lg bg-[#E1F5EE] flex items-center justify-center">
        <i class="ti ti-user-plus text-xl text-[#0F6E56]"></i>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-900">Inscrire un patient</p>
        <p class="text-xs text-gray-500">Créer un nouveau dossier patient</p>
      </div>
    </a>

    <a routerLink="/dashboard/agenda"
       class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 flex items-center gap-4 hover:border-[#0F6E56] transition cursor-pointer">
      <div class="w-11 h-11 rounded-lg bg-[#E1F5EE] flex items-center justify-center">
        <i class="ti ti-calendar text-xl text-[#0F6E56]"></i>
      </div>
      <div>
        <p class="text-sm font-semibold text-gray-900">Agenda</p>
        <p class="text-xs text-gray-500">Gérer les rendez-vous</p>
      </div>
    </a>
  </div>
</div>
